<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SleepFlow - 解析音频 (奶油晚霞版)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "sunset-amber": "#F59E0B",
                        "creamy-bg": "#FFFBF2",
                        "warm-white": "#FFFFFF",
                        "peach-track": "#FFEDD5",
                        "soft-green": "#ECFDF5",
                        "soft-green-text": "#059669",
                        "soft-amber": "#FFF7ED",
                        "soft-amber-text": "#D97706",
                    },
                    fontFamily: {
                        "display": ["Manrope", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            @apply font-display bg-creamy-bg text-stone-800;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .slider-thumb {
            @apply absolute top-1/2 -translate-y-1/2 w-6 h-6 bg-white rounded-full shadow-md border-2 border-sunset-amber;
        }
        .input-warm {
            @apply bg-warm-white border border-orange-100 focus-within:ring-2 focus-within:ring-sunset-amber/30 focus-within:border-sunset-amber transition-all duration-200;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-creamy-bg/80 ios-blur border-b border-orange-100">
<div class="flex items-center justify-between px-4 h-14">
<button class="flex items-center text-sunset-amber">
<span class="material-symbols-outlined text-[28px]">chevron_left</span>
<span class="text-lg">返回</span>
</button>
<h1 class="text-lg font-bold tracking-tight absolute left-1/2 -translate-x-1/2 text-stone-800">添加音频</h1>
<div class="w-12"></div>
</div>
</header>
<main class="flex-1 w-full max-w-[480px] mx-auto px-4 py-6 space-y-8">
<section class="space-y-3">
<h3 class="text-xs font-bold uppercase tracking-widest text-stone-400 px-1">链接</h3>
<div class="relative group">
<div class="flex items-stretch rounded-2xl overflow-hidden input-warm shadow-sm">
<input class="flex-1 bg-transparent border-none focus:ring-0 py-4 px-4 text-base placeholder:text-stone-300" placeholder="在此粘贴视频或音频链接" type="text"/>
<button class="px-4 flex items-center justify-center text-sunset-amber active:bg-orange-50 transition-colors">
<span class="material-symbols-outlined">content_paste</span>
</button>
</div>
</div>
<button class="w-full bg-sunset-amber/20 text-sunset-amber/50 cursor-not-allowed font-bold py-4 rounded-2xl transition-all duration-200">
                开始解析
            </button>
</section>
<section class="space-y-4">
<div class="bg-warm-white rounded-2xl p-4 border border-orange-50 shadow-sm">
<div class="flex gap-4">
<div class="w-24 h-24 rounded-xl bg-orange-50 flex-shrink-0 overflow-hidden relative shadow-inner">
<div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBUMgccmz6zHyceNZra-tcKWVQMRbWXDUExh1DazppnWhdFTv7UmW3ENjW0oLI-OS1TZCZmM5PRdJNYbIQTbtj06nQlHeZ15hzu_6NQ2p4AVSunKQ-TUKWFy9ec_oPlZ2jN-qR8jxYU-sXfcN4bVAUVGXWBzgtZMm2wMi0UkWBTSqVEC7FP8oHaoQENad36KBmQzv3R5Q_MH0VntAp_lZ2-LwpC-QviTGFhQeJj9vgeflz-l6qGdmJ3AD48rk2B4NogJejxpu_TX4g');"></div>
<div class="absolute bottom-1.5 right-1.5 bg-black/40 backdrop-blur-sm px-1.5 rounded text-[10px] text-white font-mono">24:15</div>
</div>
<div class="flex flex-col justify-center gap-1.5 overflow-hidden">
<h4 class="font-bold text-base leading-snug line-clamp-2 text-stone-800">深度睡眠雨声 &amp; 学习专用 Lo-Fi 节奏</h4>
<p class="text-sm text-stone-500 truncate flex items-center gap-1">
<span class="material-symbols-outlined text-sm">person</span>
                            夜眠官方频道
                        </p>
<p class="text-[11px] font-bold text-soft-green-text bg-soft-green w-fit px-2.5 py-0.5 rounded-full border border-emerald-100">解析成功</p>
</div>
</div>
</div>
</section>
<section class="space-y-6">
<div class="flex items-center justify-between px-1">
<h3 class="text-xs font-bold uppercase tracking-widest text-stone-400">播放区间</h3>
<span class="text-xs text-stone-400">自定义保存时段</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[11px] font-bold text-stone-400 text-center">开始时间</label>
<div class="input-warm rounded-xl px-4 py-3 shadow-sm">
<input class="bg-transparent border-none focus:ring-0 p-0 text-lg font-mono w-full text-center text-stone-700" placeholder="00:00" type="text" value="00:00"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-[11px] font-bold text-stone-400 text-center">结束时间</label>
<div class="bg-soft-amber border border-orange-200 rounded-xl px-4 py-3 shadow-sm">
<input class="bg-transparent border-none focus:ring-0 p-0 text-lg font-mono w-full text-center text-soft-amber-text font-bold" placeholder="00:00" type="text" value="99:59"/>
</div>
</div>
</div>
<div class="px-3 pt-4 pb-4">
<div class="relative h-1.5 flex items-center">
<div class="absolute w-full h-full bg-peach-track rounded-full"></div>
<div class="absolute left-[10%] right-[30%] h-full bg-sunset-amber rounded-full"></div>
<div class="slider-thumb left-[10%]"></div>
<div class="slider-thumb left-[70%] border-orange-400"></div>
<div class="absolute -bottom-6 left-0 text-[10px] text-stone-400 font-mono">00:00</div>
<div class="absolute -bottom-6 right-0 text-[10px] text-stone-400 font-mono">24:15</div>
</div>
</div>
<div class="flex items-start gap-2 p-3 rounded-xl bg-soft-amber border border-orange-100 text-soft-amber-text mt-4">
<span class="material-symbols-outlined text-sm mt-0.5">warning</span>
<p class="text-[11px] font-medium leading-relaxed">结束时间不能超过总时长 (24:15)</p>
</div>
</section>
<section class="pt-2 space-y-4 pb-12">
<button class="w-full bg-sunset-amber text-white font-bold py-4 rounded-2xl transition-all hover:brightness-105 active:scale-[0.98] shadow-lg shadow-orange-200">
                保存到本地库
            </button>
<div class="flex items-start gap-3 p-4 rounded-2xl bg-soft-green border border-emerald-100 text-soft-green-text">
<span class="material-symbols-outlined mt-0.5">check_circle</span>
<div class="text-sm">
<p class="font-bold">准备就绪</p>
<p class="opacity-80 text-xs mt-0.5">点击保存，将音频添加至您的本地库。</p>
</div>
</div>
</section>
</main>
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-stone-300 rounded-full opacity-30 mb-2"></div>

</body></html>
